name: Build and deploy Node.js app to Azure Web App - faa-frontend-webappservice

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required for OIDC Azure Login
      contents: read     # Required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      # For modern Next.js/React apps, use 'npm ci' for clean, reliable production builds
      # Next.js standalone builds or specific build scripts are triggered here
      - name: Install dependencies and build app
        run: |
          npm ci
          npm run build --if-present
          npm run test --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}       
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}       
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'faa-frontend-webappservice'
          # Deploys the built folder. If using Next.js standalone, change this to your build output path
          package: . 
